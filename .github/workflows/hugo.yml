name: Build and deploy
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
  deploy:
    runs-on: ubuntu-latest
    needs: test
    env:
      IMAGE: registry.fly.io/makespace-site
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # enableGitInfo needs each page's last commit, which a shallow clone
          # does not have. Without this the dates and edit footer come out
          # blank, and nothing fails.
          fetch-depth: 0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master
      # A deploy token doubles as the registry password; the username is
      # literally "x".
      - name: Log in to the Fly registry
        run: flyctl auth docker
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      # Hugo's caches live in a BuildKit cache mount, which no cache exporter
      # carries: cache-to only preserves layers, and any content edit
      # invalidates the layer that holds them. The dance below hauls the mount's
      # contents in and out of a plain actions/cache entry, so a content change
      # neither re-downloads every photo from the bucket nor re-encodes the ones
      # it did not touch.
      - name: Restore Hugo cache
        uses: actions/cache@v4
        with:
          path: ./hugo-cache
          key: hugo-cache-${{ github.run_id }}
          restore-keys:
            hugo-cache-
      - name: Inject Hugo cache into BuildKit
        uses: reproducible-containers/buildkit-cache-dance@v3.4.0
        with:
          cache-map: |
            {
              "hugo-cache": "/cache"
            }
      - name: Build and push the image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: serve
          push: true
          # Fly machines are x86; without this an arm64 runner would push an
          # image the platform refuses to release.
          platforms: linux/amd64
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # --image skips flyctl's own build entirely: the image above is the one
      # that gets released, so what CI tested is what runs.
      - name: Deploy
        run: flyctl deploy --image "${IMAGE}:${GITHUB_SHA}" --wait-timeout 5m
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
