# Where the site actually answers today. makespace.org still points at the old
# GitHub Pages deployment, so building with that would emit absolute links to a
# site this one is not.
baseURL = "https://makespace-site.fly.dev/"
locale = "en-GB"
title = "Makespace"
theme = "makespace"

# Gives every page its last commit — subject, hash and date — which the page
# footer shows alongside an edit link. It means the build needs .git, and needs
# full history rather than a shallow clone.
enableGitInfo = true

# Without this, .Lastmod falls back to .Date and the "last edited" line can
# never differ from publication. `:git` makes it the date of the page's last
# commit, which is what it should be.
[frontmatter]
  lastmod = ['lastmod', ':git', 'date', 'publishDate']

# Photos are fetched from the public Tigris bucket at build time rather than
# synced to disk first; see _partials/photo.html.
[params]
  photoBaseURL = 'https://makespace-site-content.fly.storage.tigris.dev/'
  # The logo is fetched from the branding repo at build time so this repository
  # holds no second copy to drift. Note it is 2000x1413, not square.
  logoURL = 'https://raw.githubusercontent.com/Makespace/Branding/master/Logos/makespace_logo.png'

[caches]
  [caches.images]
    dir = ':cacheDir/images'

[taxonomies]
  member = "members"
