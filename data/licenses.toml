# The licences offered on the submission form, in the order they appear.
#
# These cover the post — the words and photos on the page — and not the thing
# the member made. A physical object is not what copyright licences apply to.
#
# The ids are duplicated in submit.go, which validates against them: this file
# is not in the server image, and the server must not write an arbitrary string
# into front matter. Adding a licence means adding it in both places.

[[license]]
  id = 'cc-by-sa-4.0'
  name = 'CC BY-SA 4.0'
  url = 'https://creativecommons.org/licenses/by-sa/4.0/'
  summary = 'Share and adapt, with credit, under the same licence.'

